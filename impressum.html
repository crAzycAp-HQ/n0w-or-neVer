<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Impressum | n0w or neVer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .legal-page { max-width: 780px; margin: 0 auto; padding: 120px 24px 100px; color: var(--text); line-height: 1.7; }
    .legal-page h1 { font-family: "Space Grotesk", Arial, sans-serif; font-size: clamp(28px, 5vw, 40px); margin-bottom: 8px; }
    .legal-page h2 { font-family: "Space Grotesk", Arial, sans-serif; font-size: 20px; margin: 40px 0 12px; color: var(--ice); }
    .legal-page p, .legal-page li { color: var(--muted); font-size: 15px; }
    .legal-page a { color: var(--cyan); }
    .legal-page .placeholder { color: #ff9f6b; }
    .legal-top { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:28px; }
    .legal-back { display:inline-block; font:11px "DM Mono",monospace; letter-spacing:1px; color:var(--cyan); text-decoration:none; }
  </style>
</head>
<body data-page="imprint">
  <div class="legal-page">
    <div class="legal-top">
      <a class="legal-back" href="index.html" data-i18n="legal.back">← BACK TO HOME</a>
      <label class="language-switcher" aria-label="Language">
        <span aria-hidden="true">LANG</span>
        <select id="languageSelect">
          <option value="de">DE</option><option value="en">EN</option>
        </select>
      </label>
    </div>
    <h1 data-i18n="legal.imprint.title">Impressum</h1>
    <p data-i18n="legal.imprint.intro">Angaben gemäß § 5 DDG.</p>
    <h2 data-i18n="legal.contact">Kontakt</h2>
    <p><span data-i18n="legal.email">E-Mail:</span> <span class="placeholder">crazycap.hq@gmail.com</span></p>
    <h2 data-i18n="legal.content">Haftung für Inhalte</h2>
    <p data-i18n="legal.content.text"></p>
    <h2 data-i18n="legal.links">Haftung für Links</h2>
    <p data-i18n="legal.links.text"></p>
    <h2 data-i18n="legal.copyright">Urheberrecht</h2>
    <p data-i18n="legal.copyright.text"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
